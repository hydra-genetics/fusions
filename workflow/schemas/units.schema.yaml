$schema: "http://json-schema.org/draft-07/schema#"
description: row represents one dataset
properties:
  sample:
    type: string
    description: sample id
  type:
    type: string
    description: type of sample (N|T|R)
  flowcell:
    type: string
    description: flowcell id
  lane:
    type: string
    description: lane number
  fastq1:
    type: string
    description: absolute path to R1 fastq file
  fastq2:
    type: string
    description: absolute path to R2 fastq file
  adapter:
    type: string
    description: one or more sequence, separated by ","
  platform:
    type: string
    description: sequence platform, used to tell long-read (ONT, PACBIO) from short-read units
  processing_unit:
    type: string
    description: processing unit from the bam header (long-read data)
  barcode:
    type: string
    description: barcode (long-read data)
  bam:
    type: string
    description: absolute path to bam file (long-read data)
allOf:
  - if:
      required:
        - platform
      properties:
        platform:
          enum:
            - ONT
            - PACBIO
    then:
      required:
        - processing_unit
        - barcode
        - bam
    else:
      required:
        - flowcell
        - lane
        - fastq1
        - fastq2
        - adapter
required:
  - sample
  - type
